[package]
name = "rustc_codegen_cranelift"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[dependencies]
# These have to be in sync with each other
cranelift-codegen = { version = "0.138.0-dev", default-features = false, features = ["std", "timing", "unwind", "all-native-arch"] }
cranelift-frontend = { version = "0.138.0-dev" }
cranelift-module = { version = "0.138.0-dev" }
cranelift-native = { version = "0.138.0-dev" }
cranelift-jit = { version = "0.138.0-dev", optional = true }
cranelift-object = { version = "0.138.0-dev", default-features = false }
target-lexicon = "0.13"
gimli = { version = "0.33", default-features = false, features = ["write"] }
object = { version = "0.40.0", default-features = false, features = ["std", "read_core", "write", "archive", "coff", "elf", "macho", "pe"] }

indexmap = "2.0.0"
libloading = { version = "0.9.0", optional = true }
smallvec = "1.8.1"

# Uncomment to use an unreleased version of cranelift
[patch.crates-io]
# object's writer with hashbrown's hasher instead of SipHash for its symbol map and string
# tables (vendor/object, see its README-PATCH.md); the files it writes are unchanged.
object = { path = "vendor/object" }
# The fork's branch clif-speed (regalloc2 0.15.2 with cheaper per-function setup: the dominator
# tree only for SSA validation, register trees and spill slot lists cleared in place, operands
# read once); the allocations it makes are unchanged.
regalloc2 = { git = "https://github.com/JustPlayGames/regalloc2.git", rev = "34813c2bfd8a886c77c9e719081d69eefb02562a" }
# The fork's branch cranelift-trunk-44-comdat (Windows x64 unwinding and stack probes, relaxable
# GOT loads on x86-64 ELF, frames without a frame pointer, anonymous data via section symbols,
# volatile accesses kept as written, Windows x64 register preferences, a register allocator per
# function, COMDAT function and data sections on COFF)
cranelift-codegen = { git = "https://github.com/JustPlayGames/wasmtime.git", rev = "7951894340f3edb1c1bc75c25c934cf8776dffc6" }
cranelift-frontend = { git = "https://github.com/JustPlayGames/wasmtime.git", rev = "7951894340f3edb1c1bc75c25c934cf8776dffc6" }
cranelift-module = { git = "https://github.com/JustPlayGames/wasmtime.git", rev = "7951894340f3edb1c1bc75c25c934cf8776dffc6" }
cranelift-native = { git = "https://github.com/JustPlayGames/wasmtime.git", rev = "7951894340f3edb1c1bc75c25c934cf8776dffc6" }
cranelift-jit = { git = "https://github.com/JustPlayGames/wasmtime.git", rev = "7951894340f3edb1c1bc75c25c934cf8776dffc6" }
cranelift-object = { git = "https://github.com/JustPlayGames/wasmtime.git", rev = "7951894340f3edb1c1bc75c25c934cf8776dffc6" }
#cranelift-codegen = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#cranelift-frontend = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#cranelift-module = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#cranelift-native = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#cranelift-jit = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }
#cranelift-object = { git = "https://github.com/bytecodealliance/wasmtime.git", branch = "release-50.0.0" }

# Uncomment to use local checkout of cranelift
#cranelift-codegen = { path = "../wasmtime/cranelift/codegen" }
#cranelift-frontend = { path = "../wasmtime/cranelift/frontend" }
#cranelift-module = { path = "../wasmtime/cranelift/module" }
#cranelift-native = { path = "../wasmtime/cranelift/native" }
#cranelift-jit = { path = "../wasmtime/cranelift/jit" }
#cranelift-object = { path = "../wasmtime/cranelift/object" }

#gimli = { path = "../" }

[features]
# Enable features not ready to be enabled when compiling as part of rustc
unstable-features = ["jit", "inline_asm_sym"]
jit = ["cranelift-jit", "libloading"]
inline_asm_sym = []
unwinding = [] # Not yet included in unstable-features for performance reasons

[package.metadata.rust-analyzer]
rustc_private = true
